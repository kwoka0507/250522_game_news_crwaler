name: 중화권 게임 뉴스 크롤링 v2

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 오전 8시 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 리포지토리 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 의존성 설치
      run: npm install

    - name: 크롤링 스크립트 실행
      run: node improved-game-news-crawler.js

    - name: 결과 파일 커밋 및 푸시
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add *.json *.html
        git commit -m "자동 크롤링 결과 업데이트 $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push
